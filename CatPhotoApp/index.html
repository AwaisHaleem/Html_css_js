<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Photo App</title>
  </head>
  <body>
    <main>
      <h1>Cat Photo App</h1>
      <section>
        <h2>Cat Photos</h2>
        <p>
          Everyone loves
          <a
            href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg"
            >cute cats</a
          >
          online!
        </p>
        <p>
          See more <a href="https://freecatphotoapp.com">cat photos</a> in
          gallery.
        </p>
        <img
          src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg"
          alt="A cute Orange cat lying on its back."
        />
      </section>
      <section>
        <h2>Cat Lists</h2>
        <h3>Things Cats love:</h3>
        <ul>
          <li>catnip</li>
          <li>laser pointers</li>
          <li>lasagna</li>
        </ul>
        <figure>
          <img
            src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg"
            alt="A slice of lasagna on a plate."
          />
          <figcaption>Cats love lasanga</figcaption>
        </figure>
        <h3>Three things that cats hate:</h3>
        <ol>
          <li>flea treatment</li>
          <li>thunder</li>
          <li>other cats</li>
        </ol>
        <figure>
          <img
            src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg"
            alt="Two tabby kittens sleeping together on a couch."
          />
          <figcaption>Cats hate other cats</figcaption>
        </figure>
      </section>
    </main>

    <footer>
      <p>
        No Copyright -
        <a href="https://www.freecodecamp.org">freeCodeCamp.org</a>
      </p>
    </footer>
  </body>
</html>
