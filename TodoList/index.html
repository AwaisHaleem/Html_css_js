<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>My To-Do List</h1>
      <ul class="todo-list">
        <li class="item">
          <input id="game" type="checkbox" />
          <label for="game">Explore gaming keyboards</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org"
                target="_blank"
                >Store Link</a
              >
            </li>
          </ul>
        </li>
        <li class="item">
          <input id="report" type="checkbox" />
          <label for="report">Finish the report</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org"
                target="_blank"
                >Request Access</a
              >
            </li>
          </ul>
        </li>
        <li class="item">
          <input id="phone" type="checkbox" />
          <label for="phone">View Phone's Warranty</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org"
                target="_blank"
                >View Receipts</a
              >
            </li>
          </ul>
        </li>
        <li class="item">
          <input id="processor" type="checkbox" />
          <label for="processor">Check Processor Specs</label>
          <ul class="sub-item">
            <li>
              <a
                class="sub-item-link"
                href="https://www.freecodecamp.org"
                target="_blank"
                >View Model Number</a
              >
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </body>
</html>
