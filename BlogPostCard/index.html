<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Blog Post Card</title>
  </head>
  <body>
    <main>
      <div class="container">
        <img
          id="card-img"
          src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
          alt="Typing on laptop"
        />
        <div id="content-container">
          <h2 id="card-title">Learn Web Development in 2024</h2>
          <p id="card-description">
            Stay ahead of the curve with the latest trends in web development.
            Discover what's new and exciting in 2024.
          </p>
          <button id="card-button">Read More</button>
        </div>
      </div>
    </main>
  </body>
</html>
